name = "mtecodeapp"
main = "server.js"
compatibility_date = "2024-09-02"

[[routes]]
pattern = "medtecheurope-code.org"
custom_domain = true

[[routes]]
pattern = "www.medtecheurope-code.org"
custom_domain = true

[assets]
directory = "dist"
binding = "ASSETS"
# Pages go through the Worker (server.js) even when a file matches, so every address is redirected
# to its canonical form (no "www.", no trailing slash) and served its own HTML. The hashed
# scripts, styles and fonts under /assets/ are served directly.
run_worker_first = ["/*", "!/assets/*"]

# Historical declarations archive (read-only).
#
# IMPORTANT: the two values below identify the REMOTE database only.
# `wrangler dev` runs against a local SQLite emulation by default and ignores
# them entirely, so editing them does NOT change what a plain `wrangler dev`
# serves. Choose the dataset with the npm script, not with this file:
#
#   npm run dev:worker         -> local fixture in .wrangler/state, seeded from
#                                 d1/historical-declarations/seed.sample.sql
#                                 (100 rows, years 2022-2024; 2022 is the tell)
#   npm run dev:worker:remote  -> the real archive configured below
#                                 (31,095 rows, years 2023-2025, no 2022)
[[d1_databases]]
binding = "DB"
database_name = "historical-declarations-final"
database_id = "cd4e5d0a-0fa1-4aae-94b4-be4aa540adb0"

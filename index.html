<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>MedTech Europe Code of Ethical Business Practice | The Code App</title>
    <meta name="description" content="The full MedTech Europe Code of Ethical Business Practice: chapter text, Disclosure Guidelines, decision trees, the TPPT checker and the declarations archive." />

    <!-- Social sharing. og:url and the canonical link are deliberately omitted: this file is
         also the app shell the installed app opens for every page, so a fixed address would
         point every deep link back at the homepage. Each page's own copy, written by
         scripts/prerender-pages.mjs, adds both along with its own title and description. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MedTech Europe: The Code App" />
    <meta property="og:title" content="MedTech Europe Code of Ethical Business Practice" />
    <meta property="og:description" content="The full Code of Ethical Business Practice, Disclosure Guidelines, decision trees and compliance tools." />
    <meta property="og:image" content="https://medtecheurope-code.org/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MedTech Europe Code of Ethical Business Practice" />
    <meta name="twitter:description" content="The full Code of Ethical Business Practice, Disclosure Guidelines, decision trees and compliance tools." />
    <meta name="twitter:image" content="https://medtecheurope-code.org/logo.png" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

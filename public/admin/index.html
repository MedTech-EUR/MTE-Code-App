<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>The Code App – Content editor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <!--
      A thin bar above the editor. Sveltia CMS mounts into #nc-root instead of
      <body> when that element exists, so the bar stays visible.
    -->
    <nav class="admin-bar" aria-label="Editor tools">
      <span class="admin-bar__name">The Code App · Content editor</span>
      <span class="admin-bar__links">
        <a href="/admin/history/" target="_blank" rel="noopener">Content history: see and undo changes<span class="visually-hidden"> (opens in a new tab)</span></a>
        <a href="/" target="_blank" rel="noopener">Open the app<span class="visually-hidden"> (opens in a new tab)</span></a>
      </span>
    </nav>
    <div id="nc-root"></div>

    <!-- cms-fields.js registers the HTML field and the previews, then starts the editor. -->
    <script>window.CMS_MANUAL_INIT = true;</script>
    <!--
      Sveltia CMS, pinned to an exact version so an upstream release cannot
      change the editor unexpectedly. The integrity hash makes the browser
      refuse the file if unpkg ever serves different bytes for this version.
      To upgrade: change the version AND the hash (docs/cms-guide.md,
      "Maintaining the editor"), run the editor checks, then deploy.
      The configuration is in config.yml next to this file.
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.230.0/dist/sveltia-cms.js"
      integrity="sha384-AzagiFkRmjAMDuffoNGXass0+WVk9WahF+XJyeht4DDPxO1MHHYDp84YqPoN+XFv"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="/admin/cms-fields.js"></script>
  </body>
</html>
